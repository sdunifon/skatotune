# egui 0.36 (via nice-plug-egui) needs rustc >= 1.95, and 1.98+ adds stable
# algebraic float ops (`f32::algebraic_add` etc.) that let LLVM reassociate
# reductions in hot DSP loops. Pin one exact toolchain so builds are reproducible.
[toolchain]
channel = "1.99.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = ["aarch64-apple-darwin"]
