[package]
name = "skato_eval"
description = "Offline evaluation harness: test signals, rendering, metrics, benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
skato_core.workspace = true
skato_engine.workspace = true
# The note-intent harness replays the detector stream through the control law.
skato_detect.workspace = true
skato_control.workspace = true
hound.workspace = true
# Telemetry consumer type handed out by `Engine::take_telemetry`.
rtrb.workspace = true
# f64 FFTs for the offline reference tracker and latency cross-correlation.
realfft.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bin]]
name = "skato_eval"
path = "src/main.rs"

[[bench]]
name = "engine"
harness = false
