[package]
name = "vocal_tune"
description = "Vocal Tune: realtime vocal pitch correction (VST3 + CLAP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Audio plugins are dynamic libraries loaded by the host DAW. The extra "lib"
# lets the standalone binary and tests reuse this crate.
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
vt_core.workspace = true
vt_engine.workspace = true
nice-plug.workspace = true
nice-plug-egui.workspace = true
rtrb.workspace = true
atomic_float.workspace = true
# Saved GUI state that is not a parameter (the Labs switches). Same version
# nice-plug already pulls in for its persistent fields.
serde = { version = "1.0.229", features = ["derive"] }
# nice-plug-egui pulls egui in without fonts; enabling `default_fonts` here
# (same exact version, so Cargo unifies the features) gives the editor text.
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
# Used only by the standalone binary to enumerate audio devices for the picker.
# Same version nice-plug's cpal backend uses, so device names match exactly.
cpal = { version = "=0.18.2", optional = true }

[features]
# `cargo standalone` runs the plugin in its own window with live audio (no DAW).
standalone = ["nice-plug/standalone", "dep:cpal"]
# Panic if the audio thread ever allocates (debug builds only). Off in release.
assert_process_allocs = ["nice-plug/assert_process_allocs"]
# The editor synthesizes a sung melody (vibrato, scoops, corrected output) when
# no voiced telemetry arrives, so the pitch graph can be checked without audio.
demo-telemetry = []

# The standalone binary only builds when that feature is enabled, so normal
# plugin bundling stays lean.
[[bin]]
name = "vocal_tune_standalone"
path = "src/main.rs"
required-features = ["standalone"]

# Headless screenshot of the editor with demo telemetry (no window needed).
[[example]]
name = "render_gui"
required-features = ["demo-telemetry"]
