<svg xmlns="http://www.w3.org/2000/svg" width="760" height="366" viewBox="0 0 760 366" role="img" aria-label="Plugin latency by mode">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 15px; font-weight: 600; fill: #1f2328; }
  .sub   { font-size: 12px; fill: #59636e; }
  .lab   { font-size: 12.5px; fill: #1f2328; }
  .val   { font-size: 12px; fill: #59636e; }
  .tick  { font-size: 11px; fill: #59636e; }
  .grid  { stroke: #d1d9e0; stroke-width: 1; }
  .axis  { stroke: #818b98; stroke-width: 1; }
  .ref   { stroke: #818b98; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    .title, .lab { fill: #f0f6fc; }
    .sub, .val, .tick { fill: #9198a1; }
    .grid { stroke: #2f353d; }
    .axis, .ref { stroke: #656c76; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
  }
</style>
<text x="20.0" y="28.0" class="title" text-anchor="start">Plugin latency by mode (ms, lower is better)</text><text x="20.0" y="47.0" class="sub" text-anchor="start">Reported = what the DAW compensates. Heard = average delay of the corrected voice on 40 real singers.</text><rect x="20.0" y="63.0" width="11.0" height="11.0" rx="2" class="s1"/><text x="36.0" y="72.0" class="lab" text-anchor="start">Reported</text><rect x="101.6" y="63.0" width="11.0" height="11.0" rx="2" class="s2"/><text x="117.6" y="72.0" class="lab" text-anchor="start">Heard while correcting</text><line x1="210.0" y1="92" x2="210.0" y2="320" class="grid"/><text x="210.0" y="336.0" class="tick" text-anchor="middle">0</text><line x1="295.0" y1="92" x2="295.0" y2="320" class="grid"/><text x="295.0" y="336.0" class="tick" text-anchor="middle">2</text><line x1="380.0" y1="92" x2="380.0" y2="320" class="grid"/><text x="380.0" y="336.0" class="tick" text-anchor="middle">4</text><line x1="465.0" y1="92" x2="465.0" y2="320" class="grid"/><text x="465.0" y="336.0" class="tick" text-anchor="middle">6</text><line x1="550.0" y1="92" x2="550.0" y2="320" class="grid"/><text x="550.0" y="336.0" class="tick" text-anchor="middle">8</text><line x1="635.0" y1="92" x2="635.0" y2="320" class="grid"/><text x="635.0" y="336.0" class="tick" text-anchor="middle">10</text><line x1="720.0" y1="92" x2="720.0" y2="320" class="grid"/><text x="720.0" y="336.0" class="tick" text-anchor="middle">12</text><text x="200.0" y="118.0" class="lab" text-anchor="end">Live-Min (Classic engine)</text><rect x="210.0" y="102.0" width="42.5" height="14.0" rx="2" class="s1"/><text x="257.5" y="113.0" class="val" text-anchor="start">1.0</text><rect x="210.0" y="119.0" width="43.3" height="14.0" rx="2" class="s2"/><text x="258.4" y="130.0" class="val" text-anchor="start">1.0</text><text x="200.0" y="162.0" class="lab" text-anchor="end">Live · Soprano</text><rect x="210.0" y="146.0" width="131.8" height="14.0" rx="2" class="s1"/><text x="346.8" y="157.0" class="val" text-anchor="start">3.1</text><rect x="210.0" y="163.0" width="193.4" height="14.0" rx="2" class="s2"/><text x="408.4" y="174.0" class="val" text-anchor="start">4.6</text><text x="200.0" y="206.0" class="lab" text-anchor="end">Live · Alto/Tenor (default)</text><rect x="210.0" y="190.0" width="188.7" height="14.0" rx="2" class="s1"/><text x="403.7" y="201.0" class="val" text-anchor="start">4.4</text><rect x="210.0" y="207.0" width="280.1" height="14.0" rx="2" class="s2"/><text x="495.1" y="218.0" class="val" text-anchor="start">6.6</text><text x="200.0" y="250.0" class="lab" text-anchor="end">Live · Low Male</text><rect x="210.0" y="234.0" width="248.6" height="14.0" rx="2" class="s1"/><text x="463.6" y="245.0" class="val" text-anchor="start">5.9</text><rect x="210.0" y="251.0" width="371.0" height="14.0" rx="2" class="s2"/><text x="586.0" y="262.0" class="val" text-anchor="start">8.7</text><text x="200.0" y="294.0" class="lab" text-anchor="end">Live+ (default 10 ms)</text><rect x="210.0" y="278.0" width="425.0" height="14.0" rx="2" class="s1"/><text x="640.0" y="289.0" class="val" text-anchor="start">10.0</text><rect x="210.0" y="295.0" width="435.6" height="14.0" rx="2" class="s2"/><text x="650.6" y="306.0" class="val" text-anchor="start">10.3</text><text x="20.0" y="356.0" class="sub" text-anchor="start">Studio mode reports 20-50 ms (default 40), which the DAW compensates on recorded tracks. Values at 48 kHz.</text></svg>
